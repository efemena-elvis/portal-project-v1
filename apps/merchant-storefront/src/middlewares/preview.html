<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notched Card Demo</title>
    <style>
      body {
        background-color: #f07842; /* Outer background similar to image */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif; /* Using a common sans-serif font */
      }

      .notched-card {
        width: 380px; /* Approximate width from image */
        height: 580px; /* Approximate height from image, adjust as needed */
        /* Simulating the blurred background with a gradient.
               For a true blur, you'd need an actual image or SVG filter. */
        background:
          linear-gradient(145deg, #e0c6c0cc, #d9a087cc, #c7755acc),
          url('data:image/svg+xml,\
                            <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">\
                                <filter id="blurMe">\
                                    <feGaussianBlur in="SourceGraphic" stdDeviation="15" />\
                                </filter>\
                                <circle cx="20" cy="30" r="40" fill="%23f5a66f" filter="url(%23blurMe)"/>\
                                <circle cx="70" cy="60" r="35" fill="%23e68a55" filter="url(%23blurMe)"/>\
                                <rect width="100%" height="100%" fill="%23d97b4c" opacity="0.3" filter="url(%23blurMe)"/>\
                            </svg>');
        background-size: cover;
        background-blend-mode: overlay; /* Or other blend modes */
        position: relative;
        padding: 25px;
        box-sizing: border-box;

        /* --- CSS Variables for easy adjustments --- */
        --r: 25px; /* Main corner radius */
        --notch-size: 90px; /* Size of the notch from the corner (width and height of the cutout) */

        clip-path: path(
          /* M = Move to, L = Line to, Q = Quadratic Bezier Curve, Z = Close path */
            /* Start at top-left, after the curve starts */
            "M var(--r) 0
                 L calc(100% - var(--r)) 0                     /* Top edge */
                 Q 100% 0 100% var(--r)                        /* Top-right corner curve */
                 L 100% calc(100% - var(--notch-size))         /* Right edge down to notch start */
                 Q 100% 100% calc(100% - var(--notch-size)) 100% /* Notch curve (control point at 100% 100%) */
                 L var(--r) 100%                               /* Bottom edge to left corner start */
                 Q 0 100% 0 calc(100% - var(--r))              /* Bottom-left corner curve */
                 L 0 var(--r)                                  /* Left edge up to top corner start */
                 Q 0 0 var(--r) 0                              /* Top-left corner curve */
                 Z"
        );
      }

      .card-content {
        color: white;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .tags {
        margin-top: 200px; /* Pushes tags down, adjust as needed for content above */
        display: flex;
        gap: 10px;
        margin-bottom: 20px; /* Space before the quote */
      }

      .tags span {
        background-color: rgba(255, 255, 255, 0.15);
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 0.8em;
        font-weight: 500;
      }

      .quote {
        background-color: rgba(255, 255, 255, 0.2);
        padding: 25px;
        /*
              The quote box in the image has a more complex bottom-right corner.
              This border-radius makes top-left, top-right, and bottom-left rounded,
              and bottom-right sharp, which is a simplification.
              A true replication of the quote box's concave corner would need its own clip-path.
            */
        border-radius: 15px 15px 0 15px; /* TL, TR, BR (sharp), BL */
        font-size: 1.25em; /* Slightly smaller than image for better fit */
        line-height: 1.45;
        font-weight: 600;
        margin-bottom: 20px;
      }

      .author {
        /* margin-top: 15px; */ /* Pushed by quote's margin-bottom */
        padding-left: 5px;
      }

      .author p {
        margin: 2px 0;
        font-weight: 600;
      }

      .author .title {
        font-size: 0.85em;
        opacity: 0.8;
        font-weight: normal;
      }

      .navigation {
        margin-top: auto; /* Pushes navigation buttons to the very bottom */
        display: flex;
        justify-content: flex-end; /* Aligns buttons to the right */
        gap: 10px;
        /* Position buttons to the left of the notch area */
        padding-right: calc(
          var(--notch-size) + 5px
        ); /* Ensure buttons are clear of the notch area */
        padding-bottom: 5px; /* Some spacing from the very bottom */
      }

      .navigation button {
        background-color: white;
        border: none; /* 1px solid #eee; */
        border-radius: 8px;
        width: 40px;
        height: 40px;
        font-size: 1.3em;
        color: #555;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="notched-card">
      <div class="card-content">
        <div class="tags">
          <span>Community of designers</span>
          <span>Creative resources</span>
        </div>
        <p class="quote">
          I was able to reduce the time taken to present high-level designs by
          35% using the platform.
        </p>
        <div class="author">
          <p>Sara Bright</p>
          <p class="title">Freelancer Designer</p>
        </div>
        <div class="navigation">
          <button>←</button>
          <button>→</button>
        </div>
      </div>
    </div>
  </body>
</html>
